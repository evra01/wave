name: Vérification Wave

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch: {}

jobs:
  verifier-paiements-wave:
    runs-on: ubuntu-latest
    container: mcr.microsoft.com/playwright:v1.47.0-noble
    timeout-minutes: 4
    concurrency:
      group: verification-wave
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4

      - name: Installer les dépendances
        working-directory: wave-repo-complet/wave-monitor
        run: npm install

      - name: Lancer une vérification
        working-directory: wave-repo-complet/wave-monitor
        env:
          SERVER_URL: ${{ secrets.SERVER_URL }}
          MONITOR_TOKEN: ${{ secrets.MONITOR_TOKEN }}
        run: node wave-monitor.js
