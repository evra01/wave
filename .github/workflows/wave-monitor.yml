name: Vérification Wave

on:
  schedule:
    - cron: "* * * * *"
  workflow_dispatch: {}

jobs:
  verifier-paiements-wave:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    concurrency:
      group: verification-wave
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Installer les dépendances
        working-directory: wave-repo-complet/wave-monitor
        run: npm install

      - name: Installer Chromium (Playwright)
        working-directory: wave-repo-complet/wave-monitor
        run: npx playwright install --with-deps chromium

      - name: Lancer une vérification
        working-directory: wave-repo-complet/wave-monitor
        env:
          SERVER_URL: ${{ secrets.SERVER_URL }}
          MONITOR_TOKEN: ${{ secrets.MONITOR_TOKEN }}
        run: node wave-monitor.js
